<!doctype html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Talat Pinklao</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bai+Jamjuree:wght@500;600;700&family=IBM+Plex+Sans+Thai:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600;700&display=swap">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 48 48'%3E%3Crect width='48' height='48' rx='10' fill='%232e3a8c'/%3E%3Cpath d='M8 20 L24 9 L40 20 Z' fill='%23e3922b'/%3E%3Crect x='12' y='20' width='24' height='18' fill='%23f6eedd'/%3E%3C/svg%3E">
<link rel="stylesheet" href="/styles.css">
</head>
<body>

<div class="wrap">
  <header class="topbar">
    <div class="topbar-inner">
      <div class="brand">
        <svg class="brand-logo" viewBox="0 0 48 48" aria-hidden="true">
          <rect width="48" height="48" rx="11" style="fill:var(--primary)"/>
          <path d="M7 20 L24 8 L41 20 Z" style="fill:var(--accent)"/>
          <path d="M7 20h34v4a3 3 0 0 1-5.7 0 3 3 0 0 1-5.7 0 3 3 0 0 1-5.6 0 3 3 0 0 1-5.7 0 3 3 0 0 1-5.6 0 3 3 0 0 1-5.7 0z" style="fill:var(--canvas)"/>
          <rect x="11" y="26" width="26" height="13" rx="1.5" style="fill:var(--canvas)" opacity=".9"/>
          <rect x="20" y="30" width="8" height="9" style="fill:var(--accent)"/>
        </svg>
        <div class="brand-text">
          <div class="th"><span class="mark">ตลาด</span>ปิ่นเกล้า</div>
          <div class="en">ระบบจองล็อกและแบ่งโซนตลาด · โรงพยาบาลสมเด็จพระปิ่นเกล้า</div>
        </div>
      </div>
      <div class="role-area" id="roleArea"></div>
    </div>
    <nav class="tabs" id="tabs">
      <button class="tab active" data-tab="map">ผังตลาด</button>
      <button class="tab" data-tab="mine">การจองของฉัน</button>
      <button class="tab" data-tab="admin" id="adminTabBtn" hidden>ระบบแอดมิน</button>
    </nav>
  </header>

  <main>
    <section id="view-map"></section>
    <section id="view-mine" hidden></section>
    <section id="view-admin" hidden></section>
  </main>

  <footer>
    โครงการ "การพัฒนาเว็บแอปพลิเคชันสำหรับการจองล็อกตลาดออนไลน์และการแบ่งเขตตลาด โรงพยาบาลสมเด็จพระปิ่นเกล้า"
  </footer>
</div>

<div id="modalRoot"></div>
<div class="toast-wrap" id="toasts"></div>

<script src="/isomap.js"></script>
<script src="/app.js"></script>
</body>
</html>
